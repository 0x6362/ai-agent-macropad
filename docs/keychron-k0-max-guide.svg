<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1460" viewBox="0 0 1600 1460" role="img" aria-labelledby="title desc">
<title id="title">Keychron K0 Max keymap and LED guide</title>
<desc id="desc">M1 Claude, M2 Codex, M3 agent-shell, M4 next page, M5 Fn. Digits 1 through 9 and 0 focus sessions. Circle focuses Emacs; triangle Ghostty; square allows once and X denies the selected agent-shell permission. Unassigned digits are dark. USB-C and 2.4 GHz receiver are supported.</desc>
